# Production topology. Contexts are ../../.. — the repository root — resolved from this file.

services:
  robtic-system:
    image: ghcr.io/robticorg/robtic-system:latest
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/bot.Dockerfile
    restart: unless-stopped
    env_file:
      - /home/robtic/robtic-system/.env
    depends_on:
      - robtic-minecraft-api

  # The Minecraft API (apps/minecraft-api, minecraft.api.robtic.org).
  # The only service permitted to reach MongoDB; the bot and every Minecraft server are clients.
  # The 127.0.0.1 prefix elsewhere is deliberate; see docs/deployment-nginx.md.
  robtic-minecraft-api:
    image: ghcr.io/robticorg/robtic-minecraft-api:latest
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/minecraft-api.Dockerfile
    restart: unless-stopped
    env_file:
      - /home/robtic/robtic-system/.env
    ports:
      - "0.0.0.0:3002:3002"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Authenticates people rather than machines: a Discord identity checked against one guild.
  robtic-dashboard-api:
    image: ghcr.io/robticorg/robtic-dashboard-api:latest
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/dashboard-api.Dockerfile
    restart: unless-stopped
    env_file:
      - /home/robtic/robtic-system/.env
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Talks only to robtic-dashboard-api, and holds no database credential.
  robtic-dashboard:
    image: ghcr.io/robticorg/robtic-dashboard:latest
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/dashboard.Dockerfile
    restart: unless-stopped
    env_file:
      - /home/robtic/robtic-system/.env
    environment:
      DASHBOARD_API_INTERNAL_URL: http://robtic-dashboard-api:3003
      # Interpolated by Compose from --env-file, then passed to the container. No domain: the
      # browser calls the API port directly (localhost / SSH tunnel).
      DASHBOARD_PUBLIC_API_URL: ${DASHBOARD_PUBLIC_API_URL:-http://localhost:3003}
    depends_on:
      robtic-dashboard-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
