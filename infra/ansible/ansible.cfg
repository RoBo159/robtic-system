[defaults]
inventory = inventory/production.ini
roles_path = roles
collections_path = collections

# The built-in callback with YAML result formatting, rather than `stdout_callback = yaml`: that
# plugin lives in community.general, which the deploy workflow does not install, and it errors the
# whole run when missing.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
display_skipped_hosts = False
force_valid_group_names = ignore

gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 3600

interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
