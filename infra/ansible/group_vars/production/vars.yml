---
# Public config. Secrets are vault_* references, never literals.

# app_dir must match the absolute env_file: path in docker-compose.yml.
app_user: robtic
app_group: robtic
app_dir: /home/robtic/robtic-system

compose_project_name: robtic-system
compose_file: "{{ app_dir }}/infra/docker/compose/docker-compose.yml"
env_file_path: "{{ app_dir }}/.env"

ghcr_registry: ghcr.io
ghcr_owner: robticorg

# Deploy order: bot last. (The platform API is removed from the stack for now.)
robtic_services:
  - robtic-dashboard-api
  - robtic-dashboard
  - robtic-system

robtic_service_images:
  robtic-system: "{{ ghcr_registry }}/{{ ghcr_owner }}/robtic-system"
  robtic-dashboard-api: "{{ ghcr_registry }}/{{ ghcr_owner }}/robtic-dashboard-api"
  robtic-dashboard: "{{ ghcr_registry }}/{{ ghcr_owner }}/robtic-dashboard"

robtic_images: "{{ robtic_service_images.values() | list }}"

node_env: production

# TODO: supply before the first deploy — see README.
bot_owner_id: "695223884735053905"
command_guild_id: "1283878145463812188"
robtic_website_url: "https://robtic.org"
robtic_discord_invite: "https://discord.gg/robtic"

# No domain: the dashboard is reached at localhost (from the server itself or an SSH tunnel), and
# the browser calls the API port directly. Plain http, so Secure cookies are off. Remember to add
# http://localhost:3003/auth/callback to the Discord application's OAuth redirect URIs.
dashboard_api_url: "http://localhost:3003"
dashboard_url: "http://localhost:3000"
dashboard_public_api_url: "http://localhost:3003"
dashboard_api_port: 3003
dashboard_secure_cookies: false
dashboard_session_ttl_ms: 604800000

# ─── from vault.yml ───
mongodb_uri: "{{ vault_mongodb_uri }}"
main_bot_token: "{{ vault_main_bot_token }}"
discord_client_id: "{{ vault_discord_client_id }}"
discord_client_secret: "{{ vault_discord_client_secret }}"
dashboard_session_secret: "{{ vault_dashboard_session_secret }}"

# Only needed while the GHCR packages are private.
ghcr_username: "{{ vault_ghcr_username | default('', true) }}"
ghcr_token: "{{ vault_ghcr_token | default('', true) }}"
