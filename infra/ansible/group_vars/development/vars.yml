---
# Local rehearsal of the production playbooks. Vault optional; falls back to the shell.

app_user: "{{ lookup('env', 'USER') | default('robtic', true) }}"
app_group: "{{ lookup('env', 'USER') | default('robtic', true) }}"
app_dir: "{{ lookup('env', 'HOME') }}/robtic-system-dev"

compose_project_name: robtic-dev
compose_file: "{{ app_dir }}/infra/docker/compose/docker-compose.yml"
env_file_path: "{{ app_dir }}/.env"

ghcr_registry: ghcr.io
ghcr_owner: robticorg

robtic_services:
  - robtic-platform-api
  - robtic-dashboard-api
  - robtic-dashboard
  - robtic-system

robtic_service_images:
  robtic-system: "{{ ghcr_registry }}/{{ ghcr_owner }}/robtic-system"
  robtic-platform-api: "{{ ghcr_registry }}/{{ ghcr_owner }}/robtic-platform-api"
  robtic-dashboard-api: "{{ ghcr_registry }}/{{ ghcr_owner }}/robtic-dashboard-api"
  robtic-dashboard: "{{ ghcr_registry }}/{{ ghcr_owner }}/robtic-dashboard"

robtic_images: "{{ robtic_service_images.values() | list }}"

node_env: development

bot_owner_id: ""
command_guild_id: ""
robtic_website_url: "http://localhost:3000"
robtic_discord_invite: ""

robtic_api_host: "0.0.0.0"
robtic_api_port: 3002
robtic_api_public_url: "http://localhost:3002"

dashboard_api_url: "http://localhost:3003"
dashboard_url: "http://localhost:3000"
dashboard_public_api_url: "http://localhost:3003"
dashboard_api_port: 3003
# http locally, so a Secure cookie would never be stored.
dashboard_secure_cookies: false
dashboard_session_ttl_ms: 604800000

discord_client_id: "{{ vault_discord_client_id | default(lookup('env', 'DISCORD_CLIENT_ID'), true) }}"

mongodb_uri: "{{ vault_mongodb_uri | default('mongodb://127.0.0.1:27017/robtic', true) }}"
# NODE_ENV=development, so the code reads TestBot rather than MainBotToken.
main_bot_token: "{{ vault_main_bot_token | default(lookup('env', 'TestBot'), true) }}"
discord_client_secret: "{{ vault_discord_client_secret | default(lookup('env', 'DISCORD_CLIENT_SECRET'), true) }}"
dashboard_session_secret: "{{ vault_dashboard_session_secret | default('development-only-not-a-secret', true) }}"

ghcr_username: ""
ghcr_token: ""
