---
# Images only, no configuration change, no vault password.
#   ansible-playbook playbooks/update.yml

- name: Update the Robtic stack to the newest images
  hosts: robtic
  become: true
  serial: 1
  any_errors_fatal: true

  vars:
    # Skips env rendering and the preflight checks on the secrets that feed it.
    deploy_skip_env: true

  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
    - "{{ playbook_dir }}/../group_vars/{{ deploy_env }}/vars.yml"

  pre_tasks:
    - name: Confirm the environment file already exists
      ansible.builtin.stat:
        path: "{{ env_file_path }}"
      register: update_env_file

    - name: Require a previous deploy
      ansible.builtin.assert:
        that:
          - update_env_file.stat.exists
        fail_msg: >-
          No environment file at {{ env_file_path }}. update.yml never creates one —
          run playbooks/deploy.yml first.
        quiet: true

    - name: Announce the target
      ansible.builtin.debug:
        msg: "Updating images on {{ inventory_hostname }} — project {{ compose_project_name }}."

  roles:
    - role: deploy
      tags: [update]
