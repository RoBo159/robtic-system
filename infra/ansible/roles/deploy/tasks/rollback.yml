---
# Reached only from the rescue block, so the previous images are guaranteed to still exist.

- name: Report that a rollback is starting
  ansible.builtin.debug:
    msg: "Deploy failed. Restoring {{ deploy_rollback_map | length }} service(s)."

- name: Re-point the image tags at the previous IDs
  ansible.builtin.command: >-
    docker tag {{ item.value }} {{ robtic_service_images[item.key] }}:latest
  loop: "{{ deploy_rollback_map | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: true

- name: Bring the previous release back up
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_compose_file | dirname }}"
    project_name: "{{ deploy_compose_project }}"
    files:
      - "{{ deploy_compose_file | basename }}"
    env_files:
      - "{{ deploy_env_file }}"
    state: present
    pull: never
    recreate: always
    remove_orphans: false
    wait: true
    wait_timeout: "{{ deploy_health_timeout }}"

- name: Restore the previous environment file
  ansible.builtin.copy:
    src: "{{ deploy_env_result.backup_file }}"
    dest: "{{ deploy_env_file }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  when:
    - deploy_env_result is defined
    - deploy_env_result.backup_file is defined
  no_log: true

- name: Fail the play after rolling back
  ansible.builtin.fail:
    msg: >-
      Deploy failed and the previous release was restored. Nothing was pruned. Inspect with:
      docker compose -f {{ deploy_compose_file }} -p {{ deploy_compose_project }} logs --tail=100
