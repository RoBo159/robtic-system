---
# Renders the env file on the target. Nothing plaintext is written on the control machine.

- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Render the environment file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/env.j2"
    dest: "{{ deploy_env_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
    # The backup is what rollback restores.
    backup: true
  register: deploy_env_result
  # Without this a changed template prints every secret into the log.
  no_log: true

- name: Report whether the environment changed
  ansible.builtin.debug:
    msg: >-
      {{ 'Environment file updated — containers will be recreated.'
         if deploy_env_result.changed
         else 'Environment file already up to date.' }}
