---
# Pull, then recreate. A pull failure leaves the previous containers running.

# :latest cannot identify a version, so the immutable image ID is the rollback point.
- name: Capture the currently deployed image IDs
  ansible.builtin.command: >-
    docker inspect --format='{{ "{{" }}.Image{{ "}}" }}'
    {{ deploy_compose_project }}-{{ item }}-1
  register: deploy_previous_images
  changed_when: false
  failed_when: false
  loop: "{{ robtic_services }}"
  loop_control:
    label: "{{ item }}"

- name: Remember the rollback point
  ansible.builtin.set_fact:
    deploy_rollback_map: >-
      {{ dict(robtic_services | zip(deploy_previous_images.results
         | map(attribute='stdout') | map('trim') | list))
         | dict2items | rejectattr('value', 'equalto', '') | items2dict }}

- name: Report the rollback point
  ansible.builtin.debug:
    msg: >-
      {{ 'Rollback point: ' ~ deploy_rollback_map.keys() | list | join(', ')
         if deploy_rollback_map | length > 0
         else 'Nothing running yet — first deploy.' }}

- name: Authenticate to GHCR
  community.docker.docker_login:
    registry_url: "{{ ghcr_registry }}"
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
    reauthorize: false
  when:
    - ghcr_username | length > 0
    - ghcr_token | length > 0
  no_log: true

- name: Pull the newest images
  community.docker.docker_image_pull:
    name: "{{ item }}"
    tag: latest
  loop: "{{ robtic_images }}"
  loop_control:
    label: "{{ item }}"
  register: deploy_pull_result
  when: deploy_pull | bool

# env_files is the CLI --env-file, which resolves ${DASHBOARD_PUBLIC_API_URL} at parse time.
# It is not the same as the env_file: each service declares.
- name: Bring the stack up
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_compose_file | dirname }}"
    project_name: "{{ deploy_compose_project }}"
    files:
      - "{{ deploy_compose_file | basename }}"
    env_files:
      - "{{ deploy_env_file }}"
    state: present
    pull: never
    recreate: "{{ deploy_recreate }}"
    remove_orphans: "{{ deploy_remove_orphans }}"
    wait: true
    wait_timeout: "{{ deploy_health_timeout }}"
  register: deploy_compose_result

- name: Report what changed
  ansible.builtin.debug:
    msg: >-
      {{ deploy_compose_result.actions | map(attribute='id') | list | join(', ')
         if deploy_compose_result.actions | default([]) | length > 0
         else 'No container needed recreating.' }}
