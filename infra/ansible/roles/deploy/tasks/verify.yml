---
# Re-reads state from the daemon rather than trusting the task that just made the change.

- name: Read the state of every service container
  ansible.builtin.command: >-
    docker inspect
    --format='{{ "{{" }}.Name{{ "}}" }} {{ "{{" }}.State.Status{{ "}}" }}
    {{ "{{" }}if .State.Health{{ "}}" }}{{ "{{" }}.State.Health.Status{{ "}}" }}{{ "{{" }}else{{ "}}" }}none{{ "{{" }}end{{ "}}" }}'
    {{ deploy_compose_project }}-{{ item }}-1
  register: deploy_container_state
  changed_when: false
  failed_when: false
  loop: "{{ robtic_services }}"
  loop_control:
    label: "{{ item }}"
  retries: "{{ (deploy_health_timeout | int / deploy_health_interval | int) | int }}"
  delay: "{{ deploy_health_interval }}"
  # The bot has no healthcheck — it holds an outbound gateway connection and serves no port.
  until: >-
    deploy_container_state.rc == 0 and
    ('running' in deploy_container_state.stdout) and
    ('starting' not in deploy_container_state.stdout) and
    ('unhealthy' not in deploy_container_state.stdout)

- name: Fail the deploy when a service never came up
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - "'running' in item.stdout"
      - "'unhealthy' not in item.stdout"
    fail_msg: >-
      {{ item.item }} is not serving: {{ item.stdout | default('no such container') | trim }}.
      Nothing was pruned, so the previous images are still on disk.
    quiet: true
  loop: "{{ deploy_container_state.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report the verified state
  ansible.builtin.debug:
    msg: "{{ deploy_container_state.results | map(attribute='stdout') | map('trim') | list }}"
