---
# No firewall by design: Docker's chain precedes ufw's, so a ufw deny on a published port does nothing.

- name: Install hardening packages
  ansible.builtin.apt:
    name: "{{ security_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Harden sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    owner: root
    group: root
    mode: "0600"
    # Without this a bad directive leaves the host unreachable after the handler restarts sshd.
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { key: "PermitRootLogin", value: "{{ security_ssh_permit_root_login }}" }
    - { key: "PasswordAuthentication", value: "{{ security_ssh_password_authentication }}" }
    - { key: "Port", value: "{{ security_ssh_port }}" }
    - { key: "X11Forwarding", value: "no" }
    - { key: "MaxAuthTries", value: "3" }
  loop_control:
    label: "{{ item.key }}"
  notify: Restart sshd

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  when: security_unattended_upgrades | bool

- name: Restrict unattended upgrades to the security pocket
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-robtic-unattended
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible — infra/ansible/roles/security
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if security_unattended_reboot else 'false' }}";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
  when: security_unattended_upgrades | bool

- name: Configure the sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — infra/ansible/roles/security
      [sshd]
      enabled = true
      port = {{ security_ssh_port }}
      bantime = {{ security_fail2ban_bantime }}
      maxretry = {{ security_fail2ban_maxretry }}
  when: security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  when: security_fail2ban_enabled | bool

- name: Secure the application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    # 0750: the rendered .env lives directly in here.
    mode: "0750"
