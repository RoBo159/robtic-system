name: Deploy dashboard

# Chained to the dashboard API's *workflow* rather than to a job, because the two live in separate
# files. `workflow_run` fires once that one finishes, whatever it decided — including when it
# skipped its deploy as unchanged, which must not stop the web app going out.
#
# A failed dashboard API run is the one case that does stop it: every page here is a client of that
# service, and a web app served against a half-deployed API shows the operator errors on screens
# that were working a minute ago.
on:
  workflow_run:
    workflows: ["Deploy dashboard API"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even when nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Shared with every other deploy workflow, so a manual run of one queues behind the other instead
# of running `docker compose` on the same server at the same time.
concurrency:
  group: deploy-compose
  cancel-in-progress: false

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion != 'failure' }}
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      signature: ${{ steps.decision.outputs.signature }}
    steps:
      - uses: actions/checkout@v4
      - id: decision
        uses: ./.github/actions/deploy-decision
        with:
          service: dashboard
          force: ${{ inputs.force || false }}

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    uses: robticorg/robtic-actions/.github/workflows/deploy.yml@main
    with:
      deploy-type: docker
      runner-labels: '["self-hosted", "robtic-deploy"]'
      environment-name: 'Robtic Server'
      environment-url: 'https://dashboard.robtic.org'
      server-label: 'core.robtic.org'
      dockerfile: 'infra/docker/dockerfiles/dashboard.Dockerfile'
      image-name: 'ghcr.io/robticorg/robtic-dashboard'
      compose-project-name: 'robtic-system'
      compose-env-file: '/home/robtic/robtic-system/.env'
      compose-pull-command: 'docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env pull robtic-dashboard'
      compose-up-command: 'docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env up -d robtic-dashboard'
    secrets:
      DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}

  # Claims the signature, but only after the deploy actually succeeded — a failed run leaves it
  # unclaimed so the next push retries instead of skipping a service that never shipped.
  seal:
    name: Record what was deployed
    needs: [changes, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        run: |
          mkdir -p .deploy-signatures
          printf '%s %s %s\n' "${{ github.sha }}" "$(date -u +%FT%TZ)" "${{ github.run_id }}" \
            > .deploy-signatures/dashboard

      # continue-on-error: a concurrent run may have claimed the same key first. That is a
      # duplicate, not a failure — the deploy already happened either way.
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .deploy-signatures/dashboard
          key: deploy-v1-dashboard-${{ needs.changes.outputs.signature }}
