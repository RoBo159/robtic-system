name: Deploy Minecraft API

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even when nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-compose
  cancel-in-progress: false

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      signature: ${{ steps.decision.outputs.signature }}
    steps:
      - uses: actions/checkout@v4
      - id: decision
        uses: ./.github/actions/deploy-decision
        with:
          service: minecraft-api
          force: ${{ inputs.force || false }}

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    uses: robticorg/robtic-actions/.github/workflows/deploy.yml@main
    with:
      deploy-type: docker
      runner-labels: '["self-hosted", "robtic-deploy"]'
      environment-name: 'Robtic Server'
      environment-url: 'https://robtic.org'
      server-label: 'core.robtic.org'
      dockerfile: 'infra/docker/dockerfiles/minecraft-api.Dockerfile'
      image-name: 'ghcr.io/robticorg/robtic-minecraft-api'
      compose-project-name: 'robtic-system'
      compose-env-file: '/home/robtic/robtic-system/.env'
      compose-pull-command: 'docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env pull robtic-minecraft-api'
      compose-up-command: 'docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env up -d robtic-minecraft-api'
    secrets:
      DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}

  verify:
    name: Verify the API is serving
    needs: [changes, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: [self-hosted, robtic-deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the container to report healthy
        run: |
          set -uo pipefail
          compose="docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env"

          cid=$($compose ps -q robtic-minecraft-api)
          if [ -z "$cid" ]; then
            echo "::error::robtic-minecraft-api has no container"
            exit 1
          fi

          for attempt in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)
            running=$(docker inspect --format '{{.State.Running}}' "$cid" 2>/dev/null || echo false)

            if [ "$status" = "healthy" ]; then
              echo "healthy after $((attempt * 5))s"
              exit 0
            fi
            if [ "$running" != "true" ]; then
              echo "::error::container exited — it is crashing at startup, not merely slow"
              exit 1
            fi

            sleep 5
          done

          echo "::error::robtic-minecraft-api never became healthy within 120s"
          exit 1

      - name: Report why
        if: failure()
        run: |
          set -uo pipefail
          compose="docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env"

          echo "### robtic-minecraft-api failed to come up" >> "$GITHUB_STEP_SUMMARY"

          missing=""
          for name in MONGODB_URI MINECRAFT_API_PORT MINECRAFT_API_PUBLIC_URL; do
            if ! grep -qE "^[[:space:]]*${name}=.+" /home/robtic/robtic-system/.env; then
              missing="${missing} ${name}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing or empty in /home/robtic/robtic-system/.env:$missing" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Every required variable is present — see the container log below." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "--- last 120 log lines ---"
          $compose logs --tail=120 --no-color robtic-minecraft-api || true

  seal:
    name: Record what was deployed
    needs: [changes, deploy, verify]
    if: ${{ needs.deploy.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        run: |
          mkdir -p .deploy-signatures
          printf '%s %s %s\n' "${{ github.sha }}" "$(date -u +%FT%TZ)" "${{ github.run_id }}" \
            > .deploy-signatures/minecraft-api

      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .deploy-signatures/minecraft-api
          key: deploy-v1-minecraft-api-${{ needs.changes.outputs.signature }}
