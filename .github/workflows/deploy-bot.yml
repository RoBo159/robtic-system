name: Deploy bot

on:
  workflow_run:
    workflows: ["Deploy Minecraft API"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even when nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-compose
  cancel-in-progress: false

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion != 'failure' }}
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      signature: ${{ steps.decision.outputs.signature }}
    steps:
      # The commit the upstream run was built from, not whatever main points at now: a push landing
      # mid-deploy would otherwise make this run sign a different tree than the one being deployed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - id: decision
        uses: ./.github/actions/deploy-decision
        with:
          service: bot
          force: ${{ inputs.force || false }}

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    uses: robticorg/robtic-actions/.github/workflows/deploy.yml@main
    with:
      deploy-type: docker
      runner-labels: '["self-hosted", "robtic-deploy"]'
      environment-name: 'Robtic Server'
      environment-url: 'https://robtic.org'
      server-label: 'core.robtic.org'
      dockerfile: 'infra/docker/dockerfiles/bot.Dockerfile'
      image-name: 'ghcr.io/robticorg/robtic-system'
      compose-project-name: 'robtic-system'
      compose-env-file: '/home/robtic/robtic-system/.env'
      compose-pull-command: 'docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env pull'
      compose-up-command: 'docker compose -f infra/docker/compose/docker-compose.yml -p robtic-system --env-file /home/robtic/robtic-system/.env up -d --remove-orphans'
    secrets:
      DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}

  seal:
    name: Record what was deployed
    needs: [changes, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        run: |
          mkdir -p .deploy-signatures
          printf '%s %s %s\n' "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "$(date -u +%FT%TZ)" "${{ github.run_id }}" > .deploy-signatures/bot

      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .deploy-signatures/bot
          key: deploy-v1-bot-${{ needs.changes.outputs.signature }}
