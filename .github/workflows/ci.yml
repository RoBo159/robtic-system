name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: robticorg/robtic-actions/.github/workflows/bun-ci.yml@main
    with:
      commit-msg: ${{ github.event.head_commit.message || github.event.pull_request.title }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CI }}

  # The web apps are checked here rather than by the shared job above, because they are outside the
  # root tsconfig: Nest needs `emitDecoratorMetadata` and Next needs `jsx`, and enabling either
  # globally would change how the bot compiles. `bun run typecheck` therefore never sees them, and
  # without this job neither would CI.
  dashboard:
    name: Dashboard stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck the API
        run: bun --filter @robtic/dashboard-api typecheck

      # Builds the Nest application and asserts every guild-scoped controller carries
      # GuildAccessGuard. Needs no database or network — see apps/dashboard-api/test/route-check.ts.
      - name: Check API routes and guards
        run: bun --filter @robtic/dashboard-api test:routes

      - name: Typecheck the web app
        run: bun --filter @robtic/dashboard typecheck

      # The real build, standalone output included, which is what the Docker image runs. Catches
      # server/client boundary mistakes that typecheck cannot see — importing `next/headers` into a
      # client component fails here and nowhere else.
      - name: Build the web app
        env:
          NEXT_OUTPUT_STANDALONE: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun --filter @robtic/dashboard build
