# Every player-facing string.
#
# Keys are addressed by name, so adding a message is an edit here and nothing else. A key you
# delete shows a visible <missing message: key> marker rather than an empty line, so a mistake is
# obvious instead of silent.
#
# Colours use legacy & codes. Placeholders are %name% and are listed per message below.

prefix: "&8[&bRobtic&8] &r"

link:
  not-linked: "&cYou must link your Discord account. Run &e/link&c."
  already-linked: "&aYour account is already linked to Discord."
  unlinked: "&aYour account is no longer linked to Discord."
  not-linked-yet: "&cYour account is not linked, so there is nothing to unlink."
  # %code% %minutes%
  instructions: |
    &8&m--------------------------------
    &fLink your Minecraft account.

    &7Run this command in Discord:
    &b/minecraft link &e%code%

    &7This code expires in %minutes% minutes.
    &8&m--------------------------------

robs:
  # Robs are the Minecraft currency. They are NOT Discord coins: a separate balance that never
  # converts into the other, and one an unlinked player holds just as well as a linked one.
  #
  # %robs%
  balance: "&fBalance: &e%robs% &6robs"
  # %robs%
  sale-complete: "&aSold your items for &e%robs% &6robs&a."
  sale-queued: "&7(Offline — this sale will sync automatically when the connection returns.)"
  balance-cached: "&7(Cached — the connection is down, this may be slightly out of date.)"
  balance-pending: "&7(Includes robs from offline sales, syncing shortly.)"
  # %robs%
  synced: "&aYour offline earnings have synced. Balance: &e%robs% &6robs"
  nothing-to-sell: "&cYou have none of that item in your inventory."
  item-unavailable: "&cThat item cannot be sold right now."
  # No longer a linking prompt: robs need no Discord account, so the only way to be locked out is
  # for an operator to have taken the permission away.
  locked: "&cYou do not have permission to use the robs economy."
  unavailable: "&cThe economy is temporarily unavailable. Try again shortly."
  # Shown when the API *answered* and refused — a key, guild or server-id problem rather than an
  # outage. Retrying will not help, so the player is told to fetch someone who can read the console.
  misconfigured: "&cThis server's Robtic connection is misconfigured — ask an admin to check the server console."

  # Staff-facing robs management (/robs add|remove|see), permission robtic.robs.admin.
  admin-usage: "&cUsage: &e/robs add|give|remove <player> <amount>&c or &e/robs see <player>"
  # %value%
  admin-bad-amount: "&c\"%value%\" is not a whole number above zero."
  # %player% %robs%
  admin-balance: "&f%player% has &e%robs% &6robs&f."
  # %player% %amount% %robs%
  admin-added: "&aGave &e%amount% &6robs &ato &f%player%&a. New balance: &e%robs%&a."
  # %player% %amount% %robs%
  admin-removed: "&aTook &e%amount% &6robs &afrom &f%player%&a. New balance: &e%robs%&a."
  admin-insufficient: "&cThat player does not have enough robs for that."

  # /robs top
  top-header: "&6&lTop balances"
  # %position% %player% %robs%
  top-row: "&e#%position% &f%player% &7— &e%robs% &6robs"
  # %position% %robs%
  top-you: "&7You are &e#%position% &7with &e%robs% &6robs&7."
  top-empty: "&7Nobody has earned any robs yet."

afk:
  enter: "&7You are now AFK."
  leave: "&aWelcome back."
  already: "&7You are already AFK."
  not-afk: "&7You are not AFK."
  no-lobby: "&cNo AFK world is set. An admin can set &eafk.world&c in afk.yml, or stand somewhere and run &e/afk setlobby&c."
  usage: "&7Usage: &f/afk &7| &f/afk back &7| &f/afk setlobby|reload|status"
  lobby-set: "&aAFK lobby set to your position."
  lobby-save-failed: "&cCould not save the AFK lobby — see the console."
  reloaded: "&aafk.yml reloaded."
  # %world%
  world-gone: "&cThe world you were in (&f%world%&c) is no longer loaded, so you were left here."
  # %value%
  status-enabled: "&7AFK enabled: &f%value%"
  # %seconds%
  status-timeout: "&7Timeout: &f%seconds%s"
  # %value%
  status-lobby: "&7Destination: &f%value%"
  # %value%
  status-rewards: "&7Rewards: &f%value%"
  # %value%
  status-hiding: "&7Hiding players: &f%value%"
  # %count%
  status-count: "&7Currently AFK: &f%count%"

  # The status line above an AFK player's hotbar, redrawn once a second.
  #
  # %time%  how long they have been AFK, e.g. "12m" or "1h 4m"
  # %robs%  robs this session is worth so far
  # %total% their lifetime AFK robs, including this session
  overlay: "&c&lAFK &8| &fCollecting Robs &8• &6+%robs% &7in %time%"

  # The AFK panel on the profile GUI.
  profile-title: "&bAFK"
  # %status%
  profile-status: "&7Status: %status%"
  profile-status-yes: "&aAFK"
  profile-status-no: "&7Not AFK"
  # %time%
  profile-session: "&7Current session: &f%time%"
  # %time%
  profile-today: "&7Today: &f%time%"
  # %time%
  profile-total: "&7Lifetime: &f%time%"
  # %robs%
  profile-robs: "&7Lifetime AFK robs: &6%robs%"
  # What the running session has earned so far. %robs%
  profile-earning: "&8This session so far: &e%robs% robs"

auth:
  must-login: "&cLog in first."
  must-link: "&cLink your Discord account first. Run &e/link&c."
  unavailable: "&cAuthentication is temporarily unavailable. Please try again shortly."
  welcome: "&aWelcome back."
  resumed: "&8Signed in automatically."
  # Shown when a session was refused because the connection changed.
  new-location: "&7You are connecting from somewhere new, so please log in again."
  # %seconds%
  kicked-timeout: "&cYou took too long to log in. Rejoin and try again."
  # %minutes%
  rate-limited: "&cToo many attempts. Try again in &f%minutes% minute(s)&c."
  # %attempts%
  wrong-password: "&cThat password is not right. &7%attempts% attempt(s) left."
  # A linked account with no password is a MIGRATION, not a fault — it was linked before password
  # authentication existed. Never phrase it as something the player got wrong.
  no-password: "&eThis account needs a password to finish setup."
  # /auth, for administrators.
  admin-usage: "&7Usage: &f/auth <forcelink|forceunlink|resetpassword|resetsession|sessions> <player>"
  admin-forcelink-usage: "&7Usage: &f/auth forcelink <player> <discordId>"
  # %value%
  admin-bad-discord-id: "&c\"%value%\" is not a Discord ID. Enable Developer Mode in Discord, then right-click the user and choose Copy User ID."
  # %player%
  admin-unknown-player: "&cThis server has never seen a player called &f%player%&c. Check the spelling, or have them join once."
  # %summary%
  admin-done: "&a%summary%"
  # One live session. %server% %expires% %seen%
  admin-session: "&8• &7%server% &8— &7expires in &f%expires%&7, last seen &f%seen% &7ago"
  # %reason%
  admin-failed: "&cThat did not work: &f%reason%"

  linked: "&aYour account is linked."
  password-changed: "&aYour password has been changed."
  unlinked: "&cYour account has been unlinked."
  empty-password: "&cEnter your password first."

  # ─── The pre-join dialog (shown before the world loads) ─────────────────────────────────────
  # %attempts%
  wrong-password-remaining: "That password is not right. %attempts% attempt(s) left."
  wrong-password-unknown: "That password is not right."
  # Disconnect screens: read after the connection has closed, so they carry their own context.
  prejoin-timeout: "&cYou took too long to log in.\n\n&7Reconnect and try again."
  prejoin-unavailable: "&cThe login service is unavailable right now.\n\n&7Please try again in a moment."
  # %code% %minutes%
  prejoin-recovery: "&e&lYour reset code\n\n&f&l%code%\n\n&7Open &b#link-account &7in Discord, press &fChange Password&7,\n&7and enter it with your new password.\n\n&8Expires in %minutes% minutes. Reconnect once it is set."

  # ─── The Paper Dialog screens (Java) ────────────────────────────────────────────────────────
  #
  # Colour codes are kept out of dialog text on purpose: a dialog is rendered by the client's own
  # UI, which styles it to match the rest of the game. Legacy codes would fight that.

  # Shown ONCE to an unlinked player. Closable — everything after this happens in chat and Discord.
  dialog-link-title: "Welcome"
  dialog-link-body: "Your Minecraft account is not linked to Discord yet."
  dialog-link-steps: "Press the button below to get your link code, then open #link-account in Discord and press Link Account."
  dialog-link-button: "Get my link code"
  dialog-link-tooltip: "Runs /link for you"

  # The legacy account screen — linked before passwords existed.
  #
  # One screen, not two: it carries the setup code AND the password box, so the player reads the
  # code, sets their password in Discord, comes back to this same screen and types it in.
  dialog-setup-title: "Create Password"
  dialog-setup-body: "Finish setting up your Robtic account. This account was linked before passwords existed, so you have one step left. You will not need to link again."
  # %minutes%
  dialog-setup-steps: "Open #link-account in Discord, press Change Password, and enter the code above with the password you want. The code expires in %minutes% minutes."
  dialog-setup-then: "Then type that password below."
  # Shown before a code has been fetched, so the screen is complete on its own.
  dialog-setup-need-code: "Press Get Setup Code below, then open #link-account in Discord and press Change Password."
  dialog-setup-getcode-button: "Get setup code"
  dialog-setup-login-button: "Login"
  dialog-setup-login-tooltip: "Use the password you just set in Discord"
  dialog-setup-again-button: "Show code again"
  dialog-setup-again-tooltip: "Shows this screen and the same code again"

  # The ordinary login.
  dialog-login-title: "Login"
  dialog-login-body: "Enter your password to continue."
  dialog-login-field: "Password"
  dialog-login-button: "Login"
  dialog-forgot-button: "Forgot password"
  dialog-forgot-tooltip: "Sends you a reset code to use in Discord"

  # Replaces the login screen when Discord authenticated the player where they stood.
  dialog-done-title: "You're in"
  dialog-done-body: "Your password was set from Discord, so you have been signed in automatically."
  dialog-done-button: "Continue"

  # The code screen. %minutes%
  dialog-recovery-title: "Your code"
  dialog-recovery-body: "Open #link-account in Discord, press Change Password, and enter this code. It expires in %minutes% minutes and works once."
  dialog-recovery-button: "Done"

  # ─── The chat fallback ──────────────────────────────────────────────────────────────────────
  #
  # Used only when neither a dialog nor a Bedrock form is available.
  chat-link:
    - "&8&m                                        "
    - "&e&lWelcome"
    - ""
    - "&7Your account is not linked to Discord yet."
    - "&7Get a code, then open &b#link-account &7in Discord."
  chat-link-button: "&a&l[ Get my link code ]"

  # Printed first, without waiting on the API, so a legacy player always sees something.
  chat-setup-intro:
    - "&8&m                                        "
    - "&e&lCreate Password"
    - ""
    - "&7This account was linked before passwords existed,"
    - "&7so you have one step left. Fetching your code…"

  # %code% %minutes%
  chat-setup:
    - "&8&m                                        "
    - "&e&lCreate Password"
    - ""
    - "&7This account was linked before passwords existed,"
    - "&7so you have one step left."
    - ""
    - "&f&l%code%"
    - ""
    - "&7Open &b#link-account &7in Discord, press &fChange Password&7,"
    - "&7and enter that code with the password you want."
    - "&8Expires in %minutes% minutes."
    - ""
    - "&7Then type that password here."
    - "&8&m                                        "

  chat-login:
    - "&8&m                                        "
    - "&e&lLogin"
    - ""
    - "&7Type your password in chat. Nobody else will see it."
  chat-forgot-button: "&6&l[ Forgot password ]"

  # Shown after a code is issued to a player who already had a password. %code% %minutes%
  recovery-issued:
    - "&8&m                                        "
    - "&e&lYour recovery code"
    - ""
    - "&f&l%code%"
    - ""
    - "&7Open &b#link-account &7in Discord, press"
    - "&fChange Password&7, and enter it."
    - "&8Expires in %minutes% minutes. One use only."
    - "&8&m                                        "

  # The same code, for a player setting their FIRST password. Same mechanism, different sentence:
  # nothing is being recovered, so calling it a recovery code would only confuse them.
  # %code% %minutes%
  setup-code-issued:
    - "&8&m                                        "
    - "&a&lYour setup code"
    - ""
    - "&f&l%code%"
    - ""
    - "&7Open &b#link-account &7in Discord, press"
    - "&fChange Password&7, and enter it with the"
    - "&7password you want to use from now on."
    - "&8Expires in %minutes% minutes. One use only."
    - "&8&m                                        "

