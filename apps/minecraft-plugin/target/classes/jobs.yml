# Jobs — professions discovered by exploring.
#
# A job is entirely configuration. There is no code that knows Miner exists, and adding a profession
# needs no release: a section here, a recruiter in npc.yml, and a marker sign in the schematic.
#
# HOW A PLAYER GETS ONE
#
#   BetterStructures generates a guild building
#     ↓
#   Robtic finds the hidden marker sign inside it and deletes it
#     ↓
#   a recruitment NPC is spawned where the sign stood
#     ↓
#   a player right-clicks it and takes the job
#     ↓
#   the building becomes their workplace, and the recruiter is replaced by a workplace NPC
#
# Robtic never generates structures. It reads a marker inside one and reacts.
#
# THE MARKER SIGN
#
#   line 1   [robtic]
#   line 2   miner            ← the job id from this file
#   line 3   offset=0,1,0     ← optional; where the NPC stands relative to the sign
#   line 4   yaw=180          ← optional; which way it faces
#
# The sign is destroyed the moment it is read, so players never see it. Put several in one building
# to make a guild hall that offers a choice — the player takes one and the rest disappear.

# ─── Global ───────────────────────────────────────────────────────────────────────────────────

# How often progression is written to storage, in seconds.
#
# XP arrives many times a second while a player is mining, so it is not saved on each gain. The
# events that matter — claiming, resigning, equipping a title, quitting — save immediately whatever
# this says; this only bounds how much XP a crash can cost.
save-interval-seconds: 300

# The timezone daily sell quotas reset in.
#
# A zone rather than a rolling 24 hours, so "daily" means the same thing to every player and can be
# stated plainly. Any IANA name, or UTC.
quota-timezone: "UTC"

discovery:
  # Whether structures are scanned for markers at all. Turning this off disables the whole
  # exploration path without unwiring anything — jobs can still be granted by command.
  enabled: true

  # Worlds to scan. Empty means every world.
  #
  # Only newly generated chunks are examined, and a chunk with no sign in it is rejected from the
  # section palette without reading a single block — so this costs nothing in explored terrain.
  worlds: []

# ─── Premium limits ───────────────────────────────────────────────────────────────────────────
#
#   owned    how many professions a player may hold
#   active   how many earn XP at once
#
# The two do different work. The owned limit makes discovering a structure a decision; the active
# limit is what premium sells. Switching an active job loses NOTHING — an inactive profession keeps
# its XP, level, statistics and titles and simply stops earning — so a player can move between them
# freely, and only resigning is destructive.
#
# `robtic.tester` lifts both entirely.

limits:
  default:
    owned: 1
    active: 1

  tiers:
    1:
      owned: 2
      active: 1
    2:
      owned: 3
      active: 2

# ─── Jobs ─────────────────────────────────────────────────────────────────────────────────────
#
#   display      shown to players; & colour codes allowed
#   icon         the material in the jobs menu
#   description  a line, or a list
#   max-level    the cap, 1–1000
#   permission   an extra node required to take it, for staff-only or event professions
#   recruiter    id from npc.yml of the NPC that offers it. Defaults to <id>_recruiter
#
#   xp-curve     how XP converts to levels
#     type       linear | polynomial | exponential | table
#     base       the scale
#     factor     the steepness (polynomial and exponential)
#     levels     an explicit per-level list, for `table`
#
#     Only total XP is stored; the level is always derived from it. That means editing a curve
#     re-levels everyone consistently instead of leaving stored levels disagreeing with stored XP.
#
#   rewards      what earns XP. Keys are "<verb>:<target>", values are XP
#     verbs      break, place, harvest, fish, kill, breed, smelt, sell
#     wildcards  "break:*" applies to anything not matched by a specific key
#
#     Player-placed blocks earn nothing when broken, and immature crops earn nothing at all — so
#     place-and-break farming is worthless without any per-job configuration.
#
#   prices       what the workplace NPC pays. A number, or {server, minimum}
#     server     what the NPC pays per item
#     minimum    the floor for player-market listings. Never below `server`, so undercutting the
#                server — and the instant-flip arbitrage that would follow — is impossible
#
#   sell         requirements before the server will buy
#     require          a list of unlock conditions, same syntax as titles.yml
#     daily-quota      items per day, 0 for unlimited
#     cooldown-seconds gap between sales, 0 for none
#
#   titles       the milestone ladder: level → a full title definition
#
#     Defined here rather than in titles.yml so a profession and its titles live together. They are
#     registered into the same catalog and are ordinary titles afterwards — the same menu, filters
#     and commands apply, and nothing downstream treats "job title" as a special case.
#
#     `source: job` is applied automatically. Unlocking is automatic at the level; equipping stays
#     manual.
#
#   workspace    what claiming the structure creates
#     enabled            false for a profession with no building
#     npc                id from npc.yml of the seller NPC that staffs it, used instead of the
#                        generic one workspace.yml names for the seller role
#     protection-radius  blocks around the marker only the owner may build in or open. Omit it to
#                        use the server-wide radius from workspace.yml
#
#     This section was once spelled `workplace`, which nothing read — so every job silently had no
#     workspace at all and no structure could be claimed. That spelling is still accepted, with a
#     warning on load, so an older file keeps working. Use `workspace`.

