# Local test stack — MongoDB, the bot, and a Paper server with the Minecraft plugin baked in.
#
# This file is for a developer machine only. The production topology lives in docker-compose.yml
# and is deployed by .github/workflows/deploy.yml; nothing here is used on the server.
#
#   docker compose -f docker-compose.local.yml up --build
#
# See docs/development.md for the walkthrough.

name: robtic-local

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Exposed so you can point Compass or mongosh at the same data the stack uses.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever .env says: inside the network the database is a service name, and
      # development selects the TestBot token (see libs/config/src/bot-definitions.ts).
      MONGODB_URI: mongodb://mongo:27017/robtic
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Logs are written relative to cwd, so this surfaces them on the host.
      - ./logs:/app/logs

  # The platform API. Everything else that needs data goes through this, including the plugin.
  robtic-api:
    build:
      context: .
      dockerfile: apps/robtic-api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/robtic
      ROBTIC_API_PORT: 3002
      NODE_ENV: development
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      mongo:
        condition: service_healthy

  # The dashboard's API. Opt-in, because it needs a Discord OAuth application configured and most
  # bot work does not touch it:
  #
  #   docker compose -f docker-compose.local.yml --profile dashboard up -d
  dashboard-api:
    profiles: [dashboard]
    build:
      context: .
      dockerfile: apps/dashboard-api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/robtic
      DASHBOARD_API_PORT: 3003
      DASHBOARD_API_URL: http://localhost:3003
      DASHBOARD_URL: http://localhost:3000
      # http locally, so a Secure cookie would never be stored and login would appear to succeed
      # and then bounce straight back to the landing page.
      DASHBOARD_SECURE_COOKIES: "false"
      NODE_ENV: development
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      mongo:
        condition: service_healthy

  dashboard:
    profiles: [dashboard]
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      DASHBOARD_API_INTERNAL_URL: http://dashboard-api:3003
      DASHBOARD_PUBLIC_API_URL: http://localhost:3003
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - dashboard-api

  minecraft:
    build:
      context: ./apps/minecraft-plugin
      target: server
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
    environment:
      # Accepting Mojang's EULA is your call — set MINECRAFT_EULA=TRUE in .env to start the server.
      EULA: ${MINECRAFT_EULA:-FALSE}
    depends_on:
      - robtic-api
    volumes:
      - minecraft-data:/data
      # The plugin is configured through plugins/RobticMinecraft/api.yml, not environment
      # variables — it holds an API key rather than a database URI, and a key belongs in a file
      # you can rotate rather than in a process environment you have to restart to change.
      - ./apps/minecraft-plugin/local-config:/config-seed:ro

  # Opt-in database browser: docker compose -f docker-compose.local.yml --profile tools up -d
  mongo-express:
    image: mongo-express:1.0.2
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  minecraft-data:
